# The Hegazy Brief: configuration.
# Every checklist line is searched every day. Its result appears in the Coverage Report.
#
# queries:    Google News searches in English (the code adds the region and language settings)
# ar_queries: Google News searches in Arabic (Egypt edition)
# feeds:      direct RSS feeds (these usually include photos)
# sector:     markets | economy | finance | accounting | politics | business | wsj
# regions:    usa | europe | asia | egypt | gulf | mena | africa | latam | global

start_date: '2026-10-17'
max_age_hours: 36
per_query: 8
max_high: 8
max_radar: 8
# Address of your chat server (see worker/chat-worker.js). Leave empty to hide the assistant.
