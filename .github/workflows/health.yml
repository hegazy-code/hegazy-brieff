name: Source Health Check

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests
      - name: Run health checks
        run: python -m hb.sources
      - name: Commit state
        run: |
          git config user.name "hegazy-brief-bot"
          git config user.email "hegazy-brief-bot@users.noreply.github.com"
          git add data/source_state.json
          git commit -m "Source health check $(date -u +%FT%H:%MZ)" || echo "No changes"
          git push
