name: Build Hegazy Brief

on:
  schedule:
    # GitHub runs on UTC. 04:30 UTC = 7:30 AM Cairo on summer time (UTC+3), so the
    # edition is ready before 8 AM. After Egypt's clock change on 30 October 2026,
    # change this to "30 5 * * *".
    - cron: "30 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build today's edition
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
        run: python build.py
      - name: Publish
        run: |
          git config user.name "hegazy-brief-bot"
          git config user.email "hegazy-brief-bot@users.noreply.github.com"
          git add docs data
          git commit -m "Edition for $(date -u +%F)" || echo "Nothing changed"
          git pull --rebase origin main
          git push
